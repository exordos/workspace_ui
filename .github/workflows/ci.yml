name: CI

on:
  push:
    branches: [master, develop]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      #      - name: Prettier
      #        run: npm run format:check
      #
      #      - name: Cognitive complexity
      #        run: npm run lint:cc
      #
      #      - name: Security audit
      #        run: npm run audit:high --workspace=web

      - name: Tests
        run: npm run test

      - name: Knip (dead code report)
        continue-on-error: true
        run: npm run knip --workspace=web

      - name: Build (web)
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run build --workspace=web
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}

  e2e:
    name: E2E (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e -- --project=chromium --grep-invert @live
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/results
            playwright-report
          retention-days: 7

  build-electron:
    name: Build Electron (${{ matrix.os }})
    needs: check
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref_type == 'tag'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: package:electron:linux -- --linux rpm deb AppImage
          - os: windows-latest
            cmd: package:electron:win
          - os: macos-latest
            cmd: package:electron:mac

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      # - name: Install Electron dependencies
      #   run: npm ci
      #   working-directory: packages/electron

      # macOS: import signing certificate from secrets
      # - name: Import macOS signing certificate
      #   if: matrix.os == 'macos-latest' && env.CSC_LINK != ''
      #   env:
      #     CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      #     CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      #   run: echo "Certificate imported from secrets"

      - name: Build web
        shell: bash
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run build --workspace=web
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}

      - name: Build & Package
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run ${{ matrix.cmd }}
        env:
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}
        #   # macOS code signing (set secrets in GitHub repo settings)
        #   CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        #   # macOS notarization
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        #   # Windows code signing (future)
        #   # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        #   # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          mkdir -p upload
          cp "packages/electron/release"/Exordos\ Workspace* upload/ 2>/dev/null || true
          ls -la upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.os }}
          path: upload/*
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build-electron
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: electron-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Exordos Workspace*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

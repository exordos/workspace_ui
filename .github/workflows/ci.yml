name: CI

on:
  push:
    branches: [master, develop]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      #      - name: Prettier
      #        run: npm run format:check
      #
      #      - name: Cognitive complexity
      #        run: npm run lint:cc
      #
      #      - name: Security audit
      #        run: npm run audit:high --workspace=web

      - name: Tests
        run: npm run test

      - name: Knip (dead code report)
        continue-on-error: true
        run: npm run knip --workspace=web

      - name: Build (web)
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run build --workspace=web
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}

  e2e:
    name: E2E (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e -- --project=chromium --grep-invert @live
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/results
            playwright-report
          retention-days: 7

  build-electron:
    name: Build Electron (${{ matrix.os }})
    needs: check
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref_type == 'tag'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: package:electron:linux -- --linux rpm deb AppImage
            release_cmd: package:electron:linux:with-updates -- --linux rpm deb AppImage
            update_metadata: latest-linux.yml
            update_blockmap: "*.AppImage.blockmap"
          - os: windows-latest
            cmd: package:electron:win
            release_cmd: package:electron:win:with-updates
            update_metadata: latest.yml
            update_blockmap: "*.exe.blockmap"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      # - name: Install Electron dependencies
      #   run: npm ci
      #   working-directory: packages/electron

      - name: Build web
        shell: bash
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run build --workspace=web
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}

      - name: Build & Package
        if: github.ref_type != 'tag'
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run ${{ matrix.cmd }}
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}

      - name: Build & Package with auto-updates
        if: github.ref_type == 'tag'
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run ${{ matrix.release_cmd }}
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p upload

          release_files=("packages/electron/release"/Exordos-Workspace*)
          test "${#release_files[@]}" -gt 0
          cp "${release_files[@]}" upload/

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            metadata_files=("packages/electron/release"/latest*.yml)
            test "${#metadata_files[@]}" -gt 0
            cp "${metadata_files[@]}" upload/

            test -f "upload/${{ matrix.update_metadata }}"
            blockmaps=(upload/${{ matrix.update_blockmap }})
            test "${#blockmaps[@]}" -gt 0
          fi

          ls -la upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.os }}
          path: upload/*
          retention-days: 14

  build-electron-macos:
    name: Build signed Electron (macOS)
    needs: check
    if: github.ref_type == 'tag'
    environment: macos-release
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare release credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_PRIVATE_KEY_P8_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured in the macos-release environment"
              exit 1
            fi
          done

          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY_P8_BASE64" \
            | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$RUNNER_TEMP/AuthKey.p8"

      - name: Build web
        shell: bash
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run build --workspace=web
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}

      - name: Build, sign, and notarize
        run: |
          echo "${PROD_ENVS}" | base64 -d > packages/web/.env.production
          npm run package:electron:mac:with-updates
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          PROD_ENVS: ${{ secrets.WEB_PROD_ENVS }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Verify signatures, notarization, and architectures
        shell: bash
        run: |
          set -euo pipefail
          APP_COUNT=0
          ARM64_COUNT=0
          X64_COUNT=0
          SIGNING_TEAM=''

          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            signature=$(codesign -dvvv "$app" 2>&1)
            grep -q '^Authority=Developer ID Application:' <<< "$signature"
            grep -Eq '(^|[[:space:]])flags=.*runtime' <<< "$signature"
            grep -q '^Timestamp=' <<< "$signature"

            team=$(awk -F= '/^TeamIdentifier=/ {print $2; exit}' <<< "$signature")
            test -n "$team"
            test "$team" != 'not set'
            if [[ -z "$SIGNING_TEAM" ]]; then
              SIGNING_TEAM=$team
            else
              test "$team" = "$SIGNING_TEAM"
            fi

            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"

            executable=$(/usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            architectures=$(lipo -archs "$app/Contents/MacOS/$executable")
            case " $architectures " in
              *' arm64 '*) ARM64_COUNT=$((ARM64_COUNT + 1)) ;;
            esac
            case " $architectures " in
              *' x86_64 '*) X64_COUNT=$((X64_COUNT + 1)) ;;
            esac
            APP_COUNT=$((APP_COUNT + 1))
          # Stop at each product bundle so nested Electron Helper apps are not
          # treated as independently released artifacts.
          done < <(find packages/electron/release -type d \
            -name 'Exordos Workspace.app' -prune -print0)

          test "$APP_COUNT" -eq 2
          test "$ARM64_COUNT" -eq 1
          test "$X64_COUNT" -eq 1

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p upload
          find packages/electron/release -maxdepth 1 -type f \
            -name 'Exordos-Workspace*-mac-*' -exec cp {} upload/ \;

          metadata_files=(packages/electron/release/latest*.yml)
          test "${#metadata_files[@]}" -gt 0
          cp "${metadata_files[@]}" upload/

          test -f upload/latest-mac.yml
          blockmaps=(upload/*.zip.blockmap)
          test "${#blockmaps[@]}" -gt 0
          ls -la upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-macos-latest
          path: upload/*
          retention-days: 14

      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  publish-apt:
    name: Publish apt repository
    needs: build-electron
    # Self-hosted: the repository host is reached from inside the network, the same
    # way the Exordos element is published. A GitHub-hosted runner depends on port 22
    # staying open to the internet.
    runs-on: [self-hosted, vm]
    if: github.ref_type == 'tag'
    timeout-minutes: 10

    steps:
      # This runner keeps its workspace between runs. Leftovers from an earlier
      # release would be uploaded again, which can resurrect a version that
      # retention already dropped on the host.
      - name: Reset workspace
        run: rm -rf artifacts debs

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-ubuntu-latest
          path: artifacts

      # Prereleases stay out of the repository: in a deb version everything after
      # the last hyphen is the revision, so 0.4.0-rc1 sorts ABOVE 0.4.0 and apt
      # would offer the release candidate as the newest stable build.
      - name: Select packages
        id: select
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::${GITHUB_REF_NAME} is a prerelease tag — not published to the apt repository"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir -p debs
          find artifacts -maxdepth 1 -name '*.deb' -exec cp {} debs/ \;
          count=$(find debs -name '*.deb' | wc -l)
          echo "Packages to publish: ${count}"
          ls -la debs/

          if [[ "${count}" -eq 0 ]]; then
            echo "::error::no .deb artifacts found for tag ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      # The repository host holds the pool, the aptly database and the signing
      # key; this job only hands it the new packages. The deploy key is bound to
      # a forced command there, and to this project's package names, so it cannot
      # do anything else.
      - name: Upload to repository host
        if: steps.select.outputs.publish == 'true'
        env:
          SSH_TARGET: ${{ secrets.APT_REPO_SSH_TARGET }}
          SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.APT_REPO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "${SSH_TARGET}" ]]; then
            echo "::warning::APT_REPO_SSH_TARGET is not configured — skipping apt publication"
            exit 0
          fi

          # Credentials go to RUNNER_TEMP, not the workspace: the runner wipes it
          # per job, while the workspace outlives the run.
          umask 077
          printf '%s\n' "${SSH_KEY}" > "${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/known_hosts"

          # Only the .deb files, listed explicitly: the repository host rejects an
          # upload carrying anything else, and `release` now waits for that upload,
          # so a stray file in this directory would block the whole release.
          find debs -maxdepth 1 -name '*.deb' -printf '%P\0' \
            | tar -C debs --null --files-from=- -c \
            | ssh -T \
              -i "${RUNNER_TEMP}/deploy_key" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="${RUNNER_TEMP}/known_hosts" \
              -o StrictHostKeyChecking=yes \
              "${SSH_TARGET}"

      - name: Clean up credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/deploy_key" "${RUNNER_TEMP}/known_hosts"

  release:
    name: Create GitHub Release
    # Waits for the apt publication as well: announcing a release that never reached
    # the repository leaves `apt upgrade` users without the version the release notes
    # promise. The remaining ordering risk is the mirror image — packages published
    # while this job fails — which is recoverable by re-running it.
    needs: [build-electron, build-electron-macos, publish-apt]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: electron-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

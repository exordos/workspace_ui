##
## Workspace CI/CD — GitLab CI
##
## Mirrors .github/workflows/ci.yml logic.
## Both pipelines use the same npm scripts.
##

stages:
  - prepare
  - check
  - e2e
  - build

variables:
  NODE_VERSION: "22"
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"

default:
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/
    policy: pull-push

build-heic-decoder:
  stage: prepare
  cache: []
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake python3
    - bash packages/web/vendor/heic/build-libheif.sh --install-sdk
  artifacts:
    paths:
      - packages/web/vendor/heic/libheif.js
    expire_in: 7 days

check-web:
  stage: check
  needs: [build-heic-decoder]
  script: |
    npm install
    npm run typecheck
    npm run lint
    npm run test
    npm run knip --workspace=web || true
  artifacts:
    expire_in: 1 day

e2e-web:
  stage: e2e
  needs: [check-web, build-heic-decoder]
  script: |
    npm install
    npx playwright install --with-deps chromium
    npm run e2e -- --project=chromium --grep-invert @live
  variables:
    CI: "true"
  artifacts:
    when: on_failure
    paths:
      - e2e/results/
    expire_in: 7 days

build-web:
  stage: build
  needs: [check-web, build-heic-decoder]
  script: |
    echo "$WEB_ENVS" | base64 -d > packages/web/.env.production
    npm install
    npm run build --workspace=web
  variables:
    WEB_ENVS: "$WEB_ENVS"
  artifacts:
    paths:
      - packages/web/dist/
    expire_in: 7 days

appId: com.exordos.workspace
productName: Exordos Workspace
copyright: Copyright © 2026 Exordos Corporation JSC

directories:
  buildResources: resources
  output: release

files:
  - dist/**/*
  - renderer/**/*
  - resources/**/*

extraMetadata:
  main: dist/main.js

asar: true
# PNG icons must be readable from a real path on Linux: nativeImage / GTK do not load from inside app.asar.
asarUnpack:
  - resources/**
compression: normal

# ──────────────────────────── Deep link protocol ────────────────────────────
# Registers ew:// as a custom URL scheme so the OS can open the app via deep links.
# macOS: written into Info.plist (CFBundleURLTypes)
# Windows: written into the registry (HKCU\Software\Classes\ew)
# Linux: electron-builder adds x-scheme-handler/ew to the .desktop MimeType
protocols:
  name: Exordos Workspace
  schemes:
    - ew

# ──────────────────────────── Windows 11 ────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.ico
  artifactName: "Exordos-Workspace-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  deleteAppDataOnUninstall: false
  shortcutName: Exordos Workspace

# ──────────────────────────── macOS 26 ────────────────────────────
#
# Code Signing:
#   electron-builder reads the signing certificate from these env vars:
#     CSC_LINK          — path to .p12 file OR base64-encoded .p12 content
#     CSC_KEY_PASSWORD   — password for the .p12 file
#
#   In CI (GitHub Actions), store the .p12 as a base64 secret:
#     base64 -i certificate.p12 | pbcopy  → paste into CSC_LINK secret
#
#   Without CSC_LINK, the build runs unsigned (dev builds).
#
# Notarization:
#   After signing, the afterSign hook submits the app to Apple's notary service.
#   Preferred CI env vars: APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Apple ID credentials are also supported for local builds.
#   Without them, notarization is skipped (dev builds).
#
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: resources/icon.icns
  category: public.app-category.social-networking
  artifactName: "Exordos-Workspace-${version}-mac-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  darkModeSupport: true
  notarize: false
  # Signing identity: "Developer ID Application: TEAM_NAME (TEAM_ID)"
  # Set via CSC_LINK + CSC_KEY_PASSWORD env vars, or leave unset for unsigned dev builds.
  # identity: null  — auto-detected from CSC_LINK

afterSign: scripts/notarize.mjs

dmg:
  sign: false
  artifactName: "Exordos-Workspace-${version}-mac-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ──────────────────────────── Linux ────────────────────────────
linux:
  # Binary, .desktop Exec= and deb/rpm package name. Must match APP_SLUG in
  # src/app-identity.lib.ts: the app pins the same value as its X11 WM_CLASS,
  # which is what StartupWMClass below matches against.
  executableName: exordos-workspace
  # No `syncDesktopName`: in this monorepo it overwrites the workspace root
  # package.json with the app metadata. The entry is already named after
  # `executableName`, and `desktopName` in packages/electron/package.json is what
  # Electron reports as its app_id.
  target:
    # Ubuntu 24
    - target: deb
      arch:
        - x64
        - arm64
    # Fedora 43
    - target: rpm
      arch:
        - x64
        - arm64
    # Universal
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: resources/icons
  category: Network;InstantMessaging;Chat
  # Must be a map of Desktop Entry keys — not a raw .desktop string (breaks Icon=/Name=/Exec= merge).
  desktop:
    entry:
      StartupWMClass: exordos-workspace
      MimeType: x-scheme-handler/ew
  artifactName: "Exordos-Workspace-${version}-linux-${arch}.${ext}"

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
  priority: optional
  # Releases through 0.4.5 used `electron-app` as the Debian package name.
  # Mark the renamed package as its replacement so apt can remove the legacy
  # owner before installing the same application files under the new name.
  fpm:
    - --conflicts=electron-app
    - --replaces=electron-app

rpm:
  maintainer: Exordos <info@genesis-corporation.ru>
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core

# ──────────────────────────── Auto-update ────────────────────────────
# GitHub Releases feed embedded when a `package:*:with-updates` command is used.
# Default package commands bake in no updater (ELECTRON_DISABLE_AUTO_UPDATE=1).
# Release CI uploads the generated latest*.yml and blockmaps together with installers.
publish:
  provider: github
  owner: exordos
  repo: workspace_ui

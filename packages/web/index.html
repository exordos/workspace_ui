<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>%VITE_BRAND_APP_NAME%</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%VITE_BRAND_DESCRIPTION%" />

    <!-- PWA -->
    <meta name="theme-color" content="%VITE_BRAND_THEME_COLOR%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%VITE_BRAND_SHORT_NAME%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  </head>
  <body class="bg-bg text-text-primary">
    <div id="root"></div>
    <!-- Vendored Jitsi external_api.js is loaded from main.tsx before the app bundle (see jitsi-external-api.loader). -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
